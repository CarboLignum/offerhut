<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>OfferHut — varaa puhumalla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<!--
  КАРКАС голосового бронирования OfferHut.

  Механика взята от демо HORECA (horeca\demo-site\index.html): один файл без
  сборки, запись голоса через MediaRecorder с обходами поломок Safari,
  ни ключей ни промптов в странице — всё в воркере.

  Оформление снято с offerhut.fi: белый фон, серые секции #f5f5f5, синяя
  кнопка #4793b8, бирюзовый знак #377f89, текст #2c2c2c, подписи полей
  мелкими прописными вразрядку, карточка объекта с картинкой сверху и
  ценой «alk 100 €» справа, красный бейдж скидки, Roboto, скругления 4px.

  Смысл приложения — лень гостя. Он не станет заполнять простыню полей,
  ему проще ткнуть две кнопки на Букинге. Поэтому поля заполняет голос,
  кнопки остаются там, где ткнуть быстрее, чем сказать.

  ЗАГЛУШКИ, ждут данных заказчика:
    HAE_URL    эндпоинт поиска по базе сайта (сейчас его нет, см. отчёт)
    OBJEKTIT   3-4 объекта, пока образцы
    LISAT      доп. услуги с ценами
    KRITEERIT  простыня уточнений: добавить строку сюда и в промпт воркера
    maksuun()  переход на оплату
-->
<style>
  :root{
    --blue:#4793b8; --blue-dk:#377f89; --pale:#dae9f1; --pale2:#d7e5e7;
    --ink:#2c2c2c; --dim:#808080; --line:#ededed; --soft:#f5f5f5;
    --red:#da6060; --white:#fff;
    --r:4px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    background:var(--soft); color:var(--ink);
    font:400 16px/1.5 Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:480px; margin:0 auto; background:var(--white); min-height:100vh; padding-bottom:28px; position:relative}
  @media(min-width:520px){ .app{box-shadow:0 0 40px rgba(0,0,0,.08)} }

  /* шапка как на сайте */
  .bar{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:11px;
    padding:14px 18px; background:var(--white); border-bottom:1px solid var(--line);
  }
  .bar .logo{
    width:36px; height:36px; border-radius:8px; background:var(--blue-dk); color:#fff;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .bar .logo svg{width:20px; height:20px; fill:currentColor}
  .bar b{font-size:19px; font-weight:700; letter-spacing:-.01em}
  /* Выбор языка — справа в шапке, как на offerhut.fi. Тот же приём,
     что у остальных подписей: мелкие прописные вразрядку. */
  .kieli{
    margin-left:auto; background:transparent; border:0; cursor:pointer;
    font:inherit; font-size:11px; font-weight:500; letter-spacing:.09em;
    text-transform:uppercase; color:var(--ink); padding:4px 2px;
  }
  .kieli:focus{outline:none}
  body.foto .kieli{color:#fff}
  .kieli option{color:var(--ink); text-transform:none; letter-spacing:0}

  h1{margin:18px 18px 4px; font-size:26px; font-weight:700; letter-spacing:-.01em}
  h2{
    margin:22px 18px 10px; font-size:21px; font-weight:700; letter-spacing:-.01em;
  }
  .lead{margin:0 18px 2px; color:var(--dim); font-size:14.5px}
  .lbl{
    display:block; margin:0 0 7px; font-size:11.5px; font-weight:500; letter-spacing:.08em;
    text-transform:uppercase; color:var(--dim);
  }

  /* ФОН — на весь экран, а не полосой. Фото лежит под всем приложением
     и не двигается при прокрутке, поверх него идёт затемнение. */
  .shot{position:fixed; inset:0; z-index:0; overflow:hidden}
  /* Верстаем телефон. Кадр вертикальный 490x872 и показывается целиком:
     с заполнением он обрезается и увеличивается. */
  .shot{background:#0d1316 url("img/bg.jpg") center top/contain no-repeat}
  /* Карта Финляндии поверх фона, как на offerhut.fi. Точки показывают,
     что объекты есть по всей стране: мелкие, много, мерцают вразнобой. */
  .kartta{
    /* Карта целиком помещается в место фото: от шапки до строки
       вопроса, панель её не режет. */
    /* Положение считает скрипт: карта стоит ровно посередине между
       подписью HAKUTULOS и строкой вопроса. В процентах от высоты
       экрана зазоры получались разными на разных окнах. */
    position:absolute; left:50%; transform:translateX(-50%);
    height:42%; aspect-ratio:284/580; pointer-events:none;
  }
  .kartta svg{width:100%; height:100%; display:block; overflow:visible}
  .kartta .maa path{fill:rgba(255,255,255,.37); stroke:rgba(255,255,255,.73); stroke-width:.7}
  /* Точки цветом знака в шапке. */
  .kartta .piste{fill:var(--blue-dk); filter:drop-shadow(0 0 2px rgba(255,255,255,.9)); animation-name:vilku; animation-iteration-count:infinite;
    animation-timing-function:ease-in-out;}
  @keyframes vilku{
    0%,100%{opacity:.22; r:1.2}
    50%{opacity:1; r:2.8}
  }
  @media(prefers-reduced-motion:reduce){ .kartta .piste{animation:none; opacity:.6} }

  .shot .veil{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,.34) 0%, rgba(0,0,0,.10) 24%,
                                        rgba(0,0,0,.34) 60%, rgba(0,0,0,.78) 100%);
  }
  /* Пока идёт разговор, приложение прозрачное и всё видно на фото.
     На экранах выбора и оплаты возвращается белый лист. */
  body.foto .app{background:transparent}
  body.foto .bar{background:transparent; border-bottom:0}
  body.foto .bar b{color:#fff}
  body.foto .msg.bot{background:rgba(0,0,0,.46); border-color:rgba(255,255,255,.18); color:#fff}
  body.foto .msg.me{background:rgba(255,255,255,.92); color:var(--ink)}
  .app{position:relative; z-index:1}

  .hero{position:relative; padding-top:14px}

  /* ГАЛЕРЕЯ — перенесено с visuals.ai-craft-studio.com как есть.
     Главное, чего у меня не было: соседние карточки уменьшены и притушены,
     центральная полного размера и яркая, подпись показывается только у неё.
     Размер задаётся высотой, ширина выходит из пропорции 9:16, а отступы
     ленты — max(18px, половина экрана минус половина карточки). */
  /* До поиска галереи нет: показывать нечего. */
  .railwrap{position:relative; margin-top:10px}
  /* До поиска фото нет, но место под него остаётся: всё остальное —
     вопрос, панель, параметры — стоит там же, где и с результатом. */
  .hero.tyhja .rail{min-height:var(--h)}
  .hero.tyhja .nav{display:none}
  .rail{
    --h: min(58vh, 464px);
    --half: calc(var(--h) * 9 / 16 / 2);
    position:relative; z-index:1;
    display:flex; gap:16px; overflow-x:auto; overflow-y:hidden;
    scroll-snap-type:x mandatory; scrollbar-width:none; -webkit-overflow-scrolling:touch;
    padding-inline:max(18px, calc(50% - var(--half)));
    padding-block:10px 18px;
  }
  .rail::-webkit-scrollbar{display:none}
  .rail.dragging{cursor:grabbing; scroll-snap-type:none}

  .rail .item{
    position:relative; flex:0 0 auto;
    height:var(--h); aspect-ratio:9/16;
    border-radius:18px; overflow:hidden; scroll-snap-align:center;
    background:#0d1316;
    transform:scale(.78);
    filter:brightness(.45) saturate(.6);
    transition:transform .5s cubic-bezier(.25,.9,.3,1), filter .5s, box-shadow .5s;
    will-change:transform;
    box-shadow:0 12px 30px rgba(0,0,0,.55);
  }
  .rail .item.active{
    transform:scale(1); filter:none; z-index:2;
    box-shadow:0 2px 1px rgba(255,255,255,.07),
               0 30px 64px -18px rgba(0,0,0,.8),
               0 0 70px -30px rgba(71,147,184,.6);
  }
  .rail .item img{width:100%; height:100%; object-fit:cover; display:block; pointer-events:none}
  .rail .item .shade{
    position:absolute; left:0; right:0; bottom:0; height:52%;
    background:linear-gradient(to top, rgba(0,0,0,.88), rgba(0,0,0,.35) 45%, rgba(0,0,0,0));
    pointer-events:none; z-index:2;
  }
  /* подпись есть только у той карточки, что сейчас в середине */
  .rail .item .cap{
    position:absolute; left:0; right:0; bottom:16px; padding:0 16px;
    display:flex; flex-direction:column; gap:4px; color:#fff;
    pointer-events:none; z-index:3;
    opacity:0; transform:translateY(6px); transition:opacity .4s, transform .4s;
  }
  .rail .item.active .cap{opacity:1; transform:translateY(0)}
  .rail .item .cap i{display:block; font-style:normal; font-size:12px; letter-spacing:.07em;
    text-transform:uppercase; color:rgba(255,255,255,.78)}
  .rail .item .cap b{display:block; font-size:21px; font-weight:800; letter-spacing:-.02em; line-height:1.1}
  .rail .item .hinta{
    position:absolute; right:11px; top:11px; z-index:3;
    background:rgba(255,255,255,.94); color:var(--ink);
    font-size:13px; font-weight:700; padding:5px 9px; border-radius:4px;
  }
  .nav{
    position:absolute; top:50%; transform:translateY(-50%); z-index:6;
    width:42px; height:42px; border-radius:50%; cursor:pointer;
    border:1px solid rgba(255,255,255,.35); background:rgba(0,0,0,.42);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    color:#fff; font-size:19px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .nav:disabled{opacity:.25; cursor:default}
  .nav.prev{left:10px} .nav.next{right:10px}
  /* Оба счётчика — один типографический приём: слово мелкими прописными
     вразрядку плюс цифры. Разные блоки, но видно, что сайт один. */
  .merkki{
    font-size:11px; font-weight:500; letter-spacing:.09em; text-transform:uppercase;
    color:rgba(255,255,255,.62); white-space:nowrap;
  }
  .merkki b{
    font-weight:700; color:#bfe0ef; font-variant-numeric:tabular-nums;
    letter-spacing:.04em; margin-left:5px;
  }
  .laskuri{text-align:center; margin:0 0 8px}

  /* Над панелью стоит ТЕКУЩИЙ вопрос и только он: сменяется, а не копится.
     Разговор целиком лежит внутри рамки ввода, разобранное — под панелью. */
  .kysymys{
    font-size:15.5px; line-height:1.38; color:#fff; margin:0 22px 8px;
    display:flex; gap:8px; align-items:baseline; min-height:21px;
    text-shadow:0 1px 3px rgba(0,0,0,.55);
  }
  .kysymys .merkki{flex-shrink:0}
  .kysymys.wait{color:rgba(255,255,255,.7); font-style:italic}

  /* Ответы под панелью — просто читаемый текст, без рамок и заливки.
     В прямоугольниках их принимали за кнопки и пытались нажать. */
  .ehdot{display:flex; flex-wrap:wrap; gap:4px 22px; padding:12px 14px 0; margin:0 10px}
  .ehto{flex:0 1 auto; display:flex; gap:7px; align-items:baseline}
  .ehto .nimi{
    font-size:11px; font-weight:500; letter-spacing:.07em; text-transform:uppercase;
    color:rgba(255,255,255,.6);
  }
  .ehto .arvo{font-size:15px; font-weight:700; color:#fff}
  .ehto.auki .arvo{color:rgba(255,255,255,.45); font-weight:400}
  .ehto.kysytaan .nimi{color:#bfe0ef}
  .ehto.kysytaan .arvo{color:#bfe0ef}

  /* что агент уже знает */
  /* Собранные критерии показываются в панели микрофона, а не на фоне:
     всё управление должно быть в одном месте, под большим пальцем. */
  .chips{display:flex; flex-wrap:wrap; gap:6px; padding:0 2px 9px}
  .chips:empty{display:none}
  .chip{
    background:var(--pale); color:var(--blue-dk); border-radius:var(--r);
    padding:5px 10px; font-size:12.5px; white-space:nowrap;
  }
  .chip b{font-weight:700}

  /* карточка объекта — как на offerhut.fi */
  .cards{padding:0 18px}
  .card{
    background:var(--white); border:1px solid var(--line); border-radius:var(--r);
    margin-bottom:14px; overflow:hidden;
  }
  .card .pic{position:relative; height:172px; background:var(--pale2)}
  .card .pic img{width:100%; height:100%; object-fit:cover; display:block}
  .card .pic .noimg{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#9db3bb; font-size:13px;
  }
  .card .off{
    position:absolute; left:0; top:12px; background:var(--red); color:#fff;
    font-size:13px; font-weight:700; padding:4px 10px; border-radius:0 var(--r) var(--r) 0;
  }
  .card .fav{
    position:absolute; right:12px; top:12px; width:34px; height:34px; border-radius:50%;
    background:rgba(255,255,255,.9); border:0; color:var(--dim); font-size:17px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .card .body{padding:14px 15px}
  .card .body b.nimi{display:block; font-size:17.5px; font-weight:700; letter-spacing:-.01em}
  .card .body .alue{display:block; color:var(--dim); font-size:14px; margin-top:5px}
  .card .body .pvm{display:block; color:var(--dim); font-size:14px}
  .card .spec{display:flex; gap:14px; flex-wrap:wrap; color:var(--ink); font-size:14px; margin-top:7px}
  .card .row{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-top:12px}
  .card .hinta{text-align:right; line-height:1.15}
  .card .hinta small{display:block; color:var(--dim); font-size:12px}
  .card .hinta b{font-size:21px; font-weight:700; font-variant-numeric:tabular-nums}

  .btn{
    border:0; border-radius:var(--r); padding:13px 20px; font:inherit; font-weight:700;
    font-size:15.5px; background:var(--blue); color:#fff; cursor:pointer;
  }
  .btn.wide{width:100%; padding:15px}
  .btn.ghost{background:transparent; border:1px solid var(--blue); color:var(--blue)}
  .btn:disabled{opacity:.45; cursor:default}
  a.more{color:var(--blue); text-decoration:none; font-weight:500; font-size:15px}

  /* Действие, которое не должно читаться как кнопка: подчёркнутый текст,
     без рамки и заливки. Прямоугольники внизу экрана заказчик принимал
     за кнопки — здесь наоборот, нажимать действительно надо. */
  button.link{
    background:0; border:0; padding:0; font:inherit; cursor:pointer;
    text-decoration:underline; text-underline-offset:3px;
  }
  /* «Новый поиск» стоит под параметрами, поверх фото — значит белым. */
  .uusi{margin:16px 24px 0}
  .uusi button.link{color:#fff; font-size:14px; opacity:.85}
  /* Возврат к результатам — вверху карточки. Именно кнопка с рамкой:
     подчёркнутым текстом её не замечали. */
  .takaisin{margin:0 18px 14px}
  .takaisin .btn{padding:11px 16px; font-size:14.5px}

  /* Карточка объекта: то же оформление, что у списка, но фото крупнее —
     на неё проваливаются ради фотографии. */
  #kortti .pic{height:230px}
  #kortti .varusteet{display:flex; flex-wrap:wrap; gap:7px; margin-top:12px}
  #kortti .varusteet span{
    background:var(--soft); border:1px solid var(--line); border-radius:999px;
    padding:5px 11px; font-size:13.5px; color:var(--ink);
  }

  /* допы */
  .lisat{padding:0 18px}
  .ryhma{margin-top:18px}
  .ryhma .lbl{margin-bottom:2px}
  .lisa{display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--line)}
  .lisa .t{flex:1; min-width:0}
  .lisa .t b{display:block; font-size:15.5px; font-weight:500}
  .lisa .t small{display:block; color:var(--dim); font-size:13px; margin-top:2px}
  .lisa .p{color:var(--ink); font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums}
  .sw{
    width:48px; height:28px; border-radius:14px; border:1px solid #d6d6d6; background:#f0f0f0;
    position:relative; cursor:pointer; flex-shrink:0;
  }
  .sw::after{
    content:""; position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%;
    background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.2); transition:.18s;
  }
  .sw.on{border-color:var(--blue); background:var(--blue)}
  .sw.on::after{left:23px}

  /* поля формы */
  .field{padding:0 18px; margin-top:16px}
  .field input{
    width:100%; background:var(--white); border:1px solid #dcdcdc; color:var(--ink);
    border-radius:var(--r); padding:13px 14px; font:inherit; font-size:16px;
  }
  .field input::placeholder{color:#b3b3b3}
  .field input:focus{outline:none; border-color:var(--blue)}
  .hint{font-size:13px; color:var(--dim); margin:9px 18px 0}

  /* итог */
  .total{
    margin:18px 18px 0; background:var(--soft); border:1px solid var(--line);
    border-radius:var(--r); padding:14px 15px;
  }
  .total .r{display:flex; justify-content:space-between; font-size:14.5px; color:var(--dim); padding:3px 0}
  .total .r b{color:var(--ink); font-weight:400}
  .total .s{display:flex; justify-content:space-between; align-items:baseline; margin-top:10px; padding-top:10px; border-top:1px solid #e3e3e3}
  .total .s span:first-child{font-weight:700; font-size:16px}
  .total .s span:last-child{font-weight:700; font-size:22px; font-variant-numeric:tabular-nums}

  /* Нижняя панель. Поднята над краем экрана и микрофон стоит СПРАВА:
     телефон держат одной рукой, и большой палец достаёт правый нижний
     угол, а не левый. Поле ввода — слева от него, стрелка отправки
     внутри поля, чтобы справа была только одна крупная цель. */
  /* Панель стоит в потоке под галереей, а не прижата к низу экрана.
     Так у неё есть место расти вверх по мере разговора. */
  .dock{
    margin:14px 10px 0; background:var(--white);
    border:1px solid var(--line); border-radius:16px;
    padding:12px 12px 10px;
    box-shadow:0 6px 26px rgba(0,0,0,.14);
  }
  .dock .mrow{display:flex; align-items:center; gap:10px}
  /* Рамка ввода фиксированная по высоте и она же — поле разговора:
     сверху лента реплик, снизу строка, в которой пишут. Одна рамка,
     а не две: человек ищет сказанное там же, где отвечает. */
  .inp{
    position:relative; flex:1; min-width:0; height:168px;
    background:var(--white); border:1px solid #dcdcdc; border-radius:12px;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .inp:focus-within{border-color:var(--blue)}
  .loki{
    flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain;
    padding:11px 14px 4px;
  }
  .loki .q{color:var(--dim); font-size:14px; line-height:1.35; margin-bottom:4px}
  .loki .a{color:var(--ink); font-size:14.5px; line-height:1.35; margin-bottom:10px}
  .loki .q:last-child, .loki .a:last-child{margin-bottom:0}
  .dock textarea.say{
    width:100%; background:var(--white); border:0; border-top:1px solid #ececec;
    color:var(--ink); padding:10px 46px 10px 14px; font:inherit; font-size:16px;
    line-height:1.4; height:62px; resize:none; overflow-y:auto; display:block; flex-shrink:0;
  }
  .dock textarea.say:focus{outline:none}
  .dock .send{
    position:absolute; right:7px; bottom:8px;
    width:34px; height:34px; border-radius:50%; border:0;

  var kieli = "fi";
  function T(avain){
    var s = TEKSTIT[kieli] && TEKSTIT[kieli][avain];
    return s || TEKSTIT.fi[avain] || "";
  }

  /* Перерисовывает весь интерфейс на выбранном языке. */
  /* «Держите кнопку и говорите» — подсказка на один раз: объяснить, как
     этим пользуются. Человек ответил — он уже знает, и надпись уходит
     насовсем, в том числе при смене языка. */
  var opastettu = false;
  function opastusPois(){
    opastettu = true;
    var say = el("say");
    if (say) say.setAttribute("placeholder", "");
  }

  function kaanna(){
    var say = el("say");
    if (say) say.setAttribute("placeholder", opastettu ? "" : T("ph"));
    var parit = [
      ["o_lisat","#vaihe3 h2"], ["o_tiedot","#vaihe4 h2"],
      ["b_takaisin","#takaisin"], ["b_varaa","#toLisat"],
      ["b_jatka","#toForm"], ["b_maksuun","#pay"],
      ["b_uusi","#restart"], ["b_uusi","#uusiHaku"], ["vahvistettu","#vaihe5 h3"]
    ];
    parit.forEach(function(p){
      var n = document.querySelector(p[1]);
      if (n) n.textContent = T(p[0]);
    });
    var lbl = document.querySelectorAll("#vaihe4 .lbl");
    var avaimet = ["l_nimi","l_posti","l_puhelin"];
    for (var i = 0; i < lbl.length && i < 3; i++) lbl[i].textContent = T(avaimet[i]);
    // Подпись у текущего вопроса тоже на новом языке: номер внутри
    // сохраняем, меняем только слово.
    var merkit = document.querySelectorAll("#kysymys .merkki");
    for (var m = 0; m < merkit.length; m++) {
      var nro = merkit[m].querySelector("b");
      merkit[m].innerHTML = T("kysymys") + "<b>" + (nro ? nro.textContent : "") + "</b>";
    }
    if (typeof paivitaRail === "function") paivitaRail();
    piirraEhdot();
    if (tila.valittu) { piirraKortti(); piirraLisat(); }
    if (tila.ehdokkaat.length) piirraKortit();
  }

  var tila = { kriteerit:{}, historia:[], ehdokkaat:[], valittu:null, lisat:{}, asiakas:{}, vaihe:1 };
  var el = function(id){ return document.getElementById(id); };
  function eur(x){ return (Math.round(x*100)/100).toFixed(2).replace(".",",")+" €"; }
  function eurLyhyt(x){ return Math.round(x) + " €"; }

  /* ---------- экраны ---------- */
  function vaihe(n){
    tila.vaihe = n;
    [1,2,3,4,5].forEach(function(i){
      var s = el("vaihe"+i); if (s) s.classList.toggle("hide", i !== n);
    });
    // Фото держим только на первом экране: дальше идут цифры и поля,
    // их читают на белом.
    document.body.classList.toggle("foto", n === 1);
    el("shot").style.display = (n === 1) ? "" : "none";
    el("dock").classList.toggle("hide", n === 5);
    window.scrollTo(0,0);
  }

  /* Вопрос агента попадает в два места сразу: над панелью — ТЕКУЩИЙ, он
     там сменяется; и строкой в ленту внутри рамки ввода, где разговор
     копится и прокручивается. Ответ гостя идёт только в ленту. */
  function puhu(kuka, teksti, odota){
    var lista = el("puhelu"), ylin = el("kysymys");

    function lisaa(luokka){
      if (!lista) return;
      var d = document.createElement("div");
      d.className = luokka;
      d.textContent = teksti;
      lista.appendChild(d);
      lista.scrollTop = lista.scrollHeight;
    }

    if (kuka === "me") { lisaa("a"); return { remove:function(){} }; }

    if (odota) {
      // Ожидание висит только наверху: в ленте от него остался бы мусор.
      var vanha = ylin ? { html: ylin.innerHTML, cls: ylin.className } : null;
      if (ylin) { ylin.className = "kysymys wait"; ylin.textContent = teksti; }
      return { remove:function(){
        // Если ответ не пришёл и вопрос никто не сменил — возвращаем прежний.
        if (ylin && vanha && ylin.classList.contains("wait")) {
          ylin.className = vanha.cls;
          ylin.innerHTML = vanha.html;
        }
      } };
    }

    if (ylin) {
      ylin.className = "kysymys";
      ylin.innerHTML = '<span class="merkki">' + T("kysymys") + "<b>" + numero() + "</b></span><span></span>";
      ylin.lastChild.textContent = teksti;
    }
    lisaa("q");
    return { remove:function(){} };
  }

  /* Номер вопроса считается по тем же четырём параметрам поиска. */
  function numero(){
    var tehty = EHDOT.filter(function(x){ return x.valmis(); }).length;
    return Math.min(tehty + 1, EHDOT.length) + "/" + EHDOT.length;
  }

  /* Подсвечен тот параметр, который спрашивают сейчас — первый незакрытый. */
  function kysyttava(){
    for (var i = 0; i < EHDOT.length; i++) if (!EHDOT[i].valmis()) return EHDOT[i].id;
    return "";
  }

  function piirraEhdot(){
    var e = el("ehdot");
    if (!e) return;
    var nyt = kysyttava();
    e.innerHTML = EHDOT.map(function(x){
      var v = x.arvo();
      var luokka = "ehto" + (v ? "" : " auki") + (x.id === nyt ? " kysytaan" : "");
      return '<div class="' + luokka + '">' +
               '<span class="nimi">' + T(x.nimi) + '</span>' +
               '<span class="arvo">' + (v || T(x.tyhja)) + '</span>' +
             '</div>';
    }).join("");
  }

  function piirraChips(){
    // Чипов больше нет: собранное показывают четыре параметра под панелью.
    piirraEhdot();
  }

  /* ---------- поиск ----------
     Пока по массиву в этом файле. Когда у сайта появится эндпоинт, тело
     заменится на запрос к HAE_URL — наружу функция не меняется. */
  function etsi(){
    var k = tila.kriteerit;
    var hlo = henkilomaara();
    var budj = parseInt(String(k.budjetti||"").replace(/\D/g,""), 10) || 0;
    var yot = oita(k.saapuminen, k.lahto);

    var lista = OBJEKTIT.filter(function(o){
      if (hlo && o.vuodepaikat < hlo) return false;
      // Бюджет гость называет как придётся — за поездку или за сутки.
      // Считаем за поездку, если знаем число ночей, и даём 15 % запаса:
      // отсечь по копейкам хуже, чем показать на один вариант больше.
      if (budj && yot && o.hinta_vrk * yot > budj * 1.15) return false;
      if (budj && !yot && o.hinta_vrk > budj * 1.15) return false;
      return true;
    });

    // Объект без запрошенного допа не выбрасываем — допы часто докупаются.
    // Но тот, где всё уже есть, идёт выше.
    lista.sort(function(a,b){ return paino(b) - paino(a) || a.hinta_vrk - b.hinta_vrk; });
    function paino(o){
      var p = 0;
      ["sauna","vene","palju"].forEach(function(f){
        if (k[f] && o.varustus.indexOf(f) >= 0) p++;
      });
      return p;
    }
    tila.ehdokkaat = lista.slice(0, 5);
    return tila.ehdokkaat;
  }

  function oita(a, b){
    var d1 = pvm(a), d2 = pvm(b);
    if (!d1 || !d2) return 0;
    var n = Math.round((d2 - d1) / 86400000);
    return n > 0 ? n : 0;
  }
  // Дата приходит от модели как YYYY-MM-DD. Прочее не разбираем: пусть
  // лучше число ночей будет неизвестно, чем угадано неверно.
  function pvm(s){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||"").trim());
    return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
  }

  function summa(){
    if (!tila.valittu) return 0;
    var yot = oita(tila.kriteerit.saapuminen, tila.kriteerit.lahto) || 1;
    var hlo = henkilomaara() || 1;
    var s = tila.valittu.hinta_vrk * yot;
    LISAT.forEach(function(l){
      if (!tila.lisat[l.id]) return;
      if (tila.valittu.varustus.indexOf(l.id) >= 0) return;   // уже в комплекте
      s += l.per === "hlo" ? l.hinta * hlo : l.hinta;
    });
    return s;
  }

  /* ---------- карточки ---------- */
  /* Результат поиска рисуется в ту же галерею: крупная карточка в центре,
     соседние по краям. Отдельного экрана со списком нет. */
  function piirraKortit(){
    var rail = el("rail"), hero = el("hero"), uusi = el("uusiRivi");
    if (!rail) return;
    // Сбрасывать нечего, пока результата нет: кнопка нового поиска
    // появляется вместе с фотографиями и уходит вместе с ними.
    if (uusi) uusi.classList.toggle("hide", !tila.ehdokkaat.length);
    if (!tila.ehdokkaat.length) {
      rail.innerHTML = "";
      if (hero) hero.classList.add("tyhja");
      if (typeof paivitaRail === "function") paivitaRail();
      return;
    }
    rail.innerHTML = tila.ehdokkaat.map(function(o){
      var kuva = o.kuva ? '<img src="'+o.kuva+'" alt="">' : '<div class="noimg"></div>';
      var ale  = o.ale ? '<span class="off">'+o.ale+'%</span>' : '';
      return '<div class="item" data-pick="'+o.id+'">'+
        kuva + ale +
        '<span class="hinta">alk '+eurLyhyt(o.hinta_vrk)+'</span>'+
        '<div class="shade"></div>'+
        '<div class="cap"><i>'+o.alue+'</i><b>'+o.nimi+'</b></div>'+
      '</div>';
    }).join("");
    if (hero) hero.classList.remove("tyhja");
    rail.scrollLeft = 0;
    // Пересчёт на следующем кадре: до него браузер ещё не разместил
    // карточки, и центральная не определяется — все остаются притушенными.
    requestAnimationFrame(function(){
      if (typeof paivitaRail === "function") paivitaRail();
    });
  }

  function suomiPvm(s){
    var d = pvm(s); if (!d) return s || "";
    function kk(n){ return (n<10?"0":"")+n; }
    return kk(d.getDate())+"."+kk(d.getMonth()+1)+"."+d.getFullYear();
  }

  /* Карточку выбирают нажатием на неё же — отдельной кнопки нет.
     Лента на время перетаскивания забирает указатель себе
     (setPointerCapture), и click приходит НА ЛЕНТУ, а не на карточку:
     e.target всегда сама лента, и поиск по ней ничего не находил.
     Поэтому карточку ищем по координатам нажатия. */
  el("rail").addEventListener("click", function(e){
    if (window.railVeti && window.railVeti()) return;   // это было перетаскивание
    var k = (e.target && e.target.closest) ? e.target.closest(".item") : null;
    if (!k) {
      var n = document.elementFromPoint(e.clientX, e.clientY);
      k = (n && n.closest) ? n.closest(".item") : null;
    }
    if (!k) return;
    var id = k.getAttribute("data-pick");
    if (id) valitse(id);
  });

  /* Нажали фото — проваливаемся в карточку объекта, а не сразу в допы:
     по одной фотографии в ленте не решают. */
  function valitse(id){
    var o = null;
    for (var i=0;i<OBJEKTIT.length;i++) if (OBJEKTIT[i].id === id) o = OBJEKTIT[i];
    if (!o) return;
    tila.valittu = o;
    // Допы, которые гость уже называл, включаем сразу — второй раз
    // спрашивать о них незачем.
    LISAT.forEach(function(l){ if (tila.kriteerit[l.id]) tila.lisat[l.id] = true; });
    piirraKortti();
    vaihe(2);
  }

  /* Карточка объекта. Цена показана дважды: прейскурантом за сутки и за
     неделю — и счётом на названные гостем даты. Решение принимают по
     второму числу, а не по первому. */
  function piirraKortti(){
    var k = el("kortti"), o = tila.valittu;
    if (!k || !o) return;
    var yot = oita(tila.kriteerit.saapuminen, tila.kriteerit.lahto);
    var hlo = henkilomaara();

    var kuva = o.kuva ? '<img src="'+o.kuva+'" alt="">' : '<div class="noimg"></div>';
    var ale  = o.ale ? '<span class="off">'+o.ale+'%</span>' : '';

    var spec = [o.makuuhuoneet+" "+T("k_mh"),
                o.vuodepaikat+" "+T("k_vuodepaikkaa"),
                o.wc+" "+T("k_wc")]
               .map(function(s){ return '<span>'+s+'</span>'; }).join("");

    var varusteet = (o.varustus || []).map(function(v){
      return '<span>'+(T("v_"+v) || v)+'</span>';
    }).join("");

    var pvm = yot
      ? suomiPvm(tila.kriteerit.saapuminen)+" – "+suomiPvm(tila.kriteerit.lahto)+
        " · "+yot+" "+T("yota")+(hlo ? " · "+hlo+" "+T("hlo") : "")
      : "";

    k.innerHTML =
      '<div class="pic">'+kuva+ale+'</div>'+
      '<div class="body">'+
        '<b class="nimi">'+o.nimi+'</b>'+
        '<span class="alue">'+o.alue+'</span>'+
        (pvm ? '<span class="pvm">'+pvm+'</span>' : '')+
        '<div class="spec">'+spec+'</div>'+
        (varusteet
          ? '<span class="alue" style="margin-top:14px">'+T("sisaltyy_hintaan")+'</span>'+
            '<div class="varusteet">'+varusteet+'</div>'
          : '')+
        '<div class="row">'+
          '<span class="alue">'+eurLyhyt(o.hinta_vrk)+' '+T("p_vrk")+
            ' · '+eurLyhyt(o.hinta_vko)+' '+T("p_vko")+'</span>'+
          '<span class="hinta">'+
            '<small>'+(yot ? yot+" "+T("yota")+" × "+eurLyhyt(o.hinta_vrk) : T("yhteensa"))+'</small>'+
            '<b>'+eur(yot ? o.hinta_vrk*yot : o.hinta_vrk)+'</b>'+
          '</span>'+
        '</div>'+
      '</div>';
  }

  el("takaisin").addEventListener("click", function(){ vaihe(1); });
  el("toLisat").addEventListener("click", function(){ piirraLisat(); vaihe(3); });

  /* ---------- допы ---------- */
  /* Допов тридцать. Простынёй в один список их не читают, поэтому
     показываем группами, как на сайте: проживание, сауна, вода,
     рыбалка, детям, прочее. */
  function piirraLisat(){
    var hlo = henkilomaara() || 1;
    var ryhmat = [];
    LISAT.forEach(function(l){ if (ryhmat.indexOf(l.r) < 0) ryhmat.push(l.r); });

    el("lisat").innerHTML = ryhmat.map(function(r){
      var rivit = LISAT.filter(function(l){ return l.r === r; }).map(function(l){
        var kuuluu = tila.valittu && tila.valittu.varustus.indexOf(l.id) >= 0;
        var hinta;
        if (kuuluu)                   hinta = T("sisaltyy");
        else if (l.per === "paikalla")hinta = T("paikalla");
        else if (!l.hinta)            hinta = T("veloituksetta");
        else                          hinta = eur(l.per === "hlo" ? l.hinta * hlo : l.hinta);
        var on = (tila.lisat[l.id] || kuuluu) ? " on" : "";
        return '<div class="lisa">'+
          '<div class="t"><b>'+l.nimi+'</b>'+(l.alt?'<small>'+l.alt+'</small>':'')+'</div>'+
          '<span class="p">'+hinta+'</span>'+
          '<div class="sw'+on+'" data-l="'+l.id+'"'+(kuuluu?' style="opacity:.4; pointer-events:none"':'')+'></div>'+
        '</div>';
      }).join("");
      return '<div class="ryhma"><span class="lbl">'+T(r)+'</span>'+rivit+'</div>';
    }).join("");
    piirraTotal();
  }

  /* Состав группы: взрослые плюс дети. Малыши до двух лет в число мест
     на сайте не идут, поэтому и здесь не считаются. */
  function henkilomaara(){
    var a = parseInt(tila.kriteerit.aikuiset, 10) || 0;
    var l = parseInt(tila.kriteerit.lapset, 10) || 0;
    var n = a + l;
    if (!n) n = parseInt(tila.kriteerit.henkiloa, 10) || 0;
    return n;
  }

  el("lisat").addEventListener("click", function(e){
    var id = e.target.getAttribute("data-l");
    if (!id) return;
    tila.lisat[id] = !tila.lisat[id];
    piirraLisat();
  });

  function piirraTotal(){
    if (!tila.valittu) return;
    var yot = oita(tila.kriteerit.saapuminen, tila.kriteerit.lahto) || 1;
    var hlo = henkilomaara() || 1;
    var rivit = '<div class="r"><b>'+tila.valittu.nimi+'</b><span>'+eur(tila.valittu.hinta_vrk*yot)+'</span></div>'+
                '<div class="r"><b>'+yot+' yötä · '+hlo+' hlö</b><span></span></div>';
    LISAT.forEach(function(l){
      if (!tila.lisat[l.id]) return;
      if (tila.valittu.varustus.indexOf(l.id) >= 0) return;
      var h = l.per === "hlo" ? l.hinta*hlo : l.hinta;
      rivit += '<div class="r"><b>'+l.nimi+'</b><span>'+eur(h)+'</span></div>';
    });
    var html = rivit + '<div class="s"><span>' + T("yhteensa") + '</span><span>'+eur(summa())+'</span></div>';
    el("total").innerHTML = html;
    if (el("total2")) el("total2").innerHTML = html;
  }

  el("toForm").addEventListener("click", function(){
    if (tila.asiakas.nimi)    el("fName").value = tila.asiakas.nimi;
    if (tila.asiakas.sahko)   el("fMail").value = tila.asiakas.sahko;
    if (tila.asiakas.puhelin) el("fTel").value  = tila.asiakas.puhelin;
    piirraTotal();
    vaihe(4);
  });

  /* ---------- оплата: ЗАГЛУШКА ---------- */
  el("pay").addEventListener("click", function(){
    tila.asiakas.nimi    = el("fName").value.trim();
    tila.asiakas.sahko   = el("fMail").value.trim();
    tila.asiakas.puhelin = el("fTel").value.trim();
    maksuun();
  });

  function maksuun(){
    var yot = oita(tila.kriteerit.saapuminen, tila.kriteerit.lahto) || 1;
    el("okRivi").textContent = (tila.valittu ? tila.valittu.nimi : "") + " · " +
      suomiPvm(tila.kriteerit.saapuminen) + " – " + suomiPvm(tila.kriteerit.lahto) +
      " · " + yot + " yötä · " + (henkilomaara()||"?") + " hlö";
    el("okSumma").textContent = eur(summa());
    vaihe(5);
    // ЗАГЛУШКА: сюда встанет переход к платёжному провайдеру.
    // window.location.href = "https://maksu.example/..." + varausId;
  }

  /* Новый поиск. Стирается всё: критерии, разговор, результат и выбранный
     объект — экран возвращается в тот вид, с которого приложение открылось.
     Одна и та же работа для кнопки под результатом и для кнопки на экране
     подтверждения, поэтому она здесь одна. */
  function uusiHaku(){
    tila = { kriteerit:{}, historia:[], ehdokkaat:[], valittu:null, lisat:{}, asiakas:{}, vaihe:1 };
    el("puhelu").innerHTML = "";
    el("kysymys").innerHTML = "";
    el("say").value = "";
    piirraKortit();
    piirraEhdot();
    vaihe(1);
    aloita();
  }
  el("restart").addEventListener("click", uusiHaku);
  el("uusiHaku").addEventListener("click", uusiHaku);

  /* ---------- разговор ----------
     На провод идёт тот же диалект, что в HORECA: contents с ролями
     user/model, голос как inlineData. Ответ воркера:
     { kriteerit:{...}, kysymys:"...", valmis:bool, valinta:"o2", asiakas:{...} } */
  var busy = false;

  function laheta(parts, nakyva){
    if (busy) return;
    busy = true;
    opastusPois();
    if (nakyva) puhu("me", nakyva);
    var odotus = puhu("bot", "…", true);
    tila.historia.push({ role:"user", parts: parts });

    fetch(API, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        mode:"varaus",
        kieli: (el("kieli") ? el("kieli").value : "fi"),
        kriteerit: tila.kriteerit,
        vaihe: tila.vaihe,
        ehdokkaat: tila.ehdokkaat.map(function(o){ return {id:o.id, nimi:o.nimi, hinta_vrk:o.hinta_vrk}; }),
        contents: tila.historia.slice(-30)
      })
    })
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(d){ odotus.remove(); kasittele(d); })
    .catch(function(e){
      odotus.remove();
      puhu("bot", T("yhteys"));
      el("st").textContent = String(e && e.message || e);
    })
    .finally(function(){ busy = false; });
  }

  function kasittele(d){
    d = d || {};
    // Гость сказал «начнём заново» — всё стирается тем же путём, что и
    // по кнопке. Отдельной ветки у голоса нет.
    if (d.nollaa) { uusiHaku(); return; }
    // Критерии только дописываются: агент не должен терять сказанное раньше.
    if (d.kriteerit) Object.keys(d.kriteerit).forEach(function(k){
      var v = d.kriteerit[k];
      if (v !== "" && v !== null && v !== undefined) tila.kriteerit[k] = v;
    });
    if (d.asiakas) Object.keys(d.asiakas).forEach(function(k){
      if (d.asiakas[k]) tila.asiakas[k] = d.asiakas[k];
    });
    piirraChips();

    // Разобранное показывают четыре параметра под панелью — второй раз
    // в ленте оно не нужно.

    var sana = d.kysymys || d.viesti || "";
    if (sana) {
      puhu("bot", sana);
      tila.historia.push({ role:"model", parts:[{text:sana}] });
    }
    if (d.valinta) { valitse(d.valinta); return; }
    // Четыре параметра закрыты — ищем и показываем результат тут же,
    // на первом экране. Отдельного экрана со списком нет. Поиск идёт
    // заново на КАЖДОМ следующем ответе: гость меняет условия голосом,
    // и выдача обновляется сама, без кнопок.
    if (d.valmis || !kysyttava()) {
      etsi();
      piirraKortit();
      // Смотрел карточку, а назвал другие условия — возвращаем к выдаче,
      // иначе новый результат остался бы за спиной. С брони не уводим.
      if (tila.vaihe === 2) vaihe(1);
      // Подсказка живёт там же, где всё управление: под микрофоном.
      el("st").textContent = T("vihje_muuta");
    }
  }

  function aloita(){
    // Начинаем тем же, чем начинается форма на сайте: один короткий
    // вопрос, на который можно ответить одним словом. Простыня «расскажите
    // какой домик вы хотите» не даёт человеку что ответить.
    puhu("bot", "Milloin tulisitte? Esim. 27.12.–2.1.");

  }

  function sendText(){
    var t = el("say").value.trim();
    if (!t) return;
    el("say").value = "";
    laheta([{text:t}], t);
  }
  el("send").addEventListener("click", sendText);
  el("say").addEventListener("keydown", function(e){
    // Enter отправляет, Shift+Enter делает перенос строки.
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendText(); }
  });

  /* ---------- голос ----------
     Перенесено из демо HORECA вместе с обходами: старый Safari не
     возвращает промис из decodeAudioData, а формат, который он не
     декодирует, модель всё равно читает. Ни то ни другое не должно
     стоить записи. */
  var rec=null, chunks=[], stream=null, t0=0, ticker=null;

  /* Удержание, а не нажатие: держишь — говоришь, отпустил — ушло.
     Не надо помнить, что кнопку жмут второй раз. contextmenu гасим:
     на телефоне долгое нажатие иначе открывает меню. */
  (function(){
    var mic = el("mic");
    mic.addEventListener("pointerdown", function(e){
      if (busy) return;
      e.preventDefault();
      startRec();
    });
    function lopeta(){ if (rec && rec.state === "recording") stopRec(); }
    document.addEventListener("pointerup", lopeta);
    document.addEventListener("pointercancel", lopeta);
    mic.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  })();

  /* Разрешение на микрофон браузер спрашивает на КАЖДЫЙ getUserMedia,
     а страница, открытая с диска, не запоминает его между вызовами.
     Поэтому поток берём один раз и держим: гость отвечает на четыре
     вопроса, а не тыкает «разрешить» четыре раза. */
  function anna(){
    var elossa = stream && stream.getTracks().some(function(t){ return t.readyState === "live"; });
    if (elossa) return Promise.resolve(stream);
    return navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
      stream = s;
      return s;
    });
  }

  function startRec(){
    if (!navigator.mediaDevices || !window.MediaRecorder){
      el("st").textContent = T("s_ei_tue");
      return;
    }
    anna().then(function(s){
      chunks = [];
      rec = new MediaRecorder(s);
      rec.ondataavailable = function(e){ if (e.data.size) chunks.push(e.data); };
      rec.onstop = finishRec;
      rec.start(); t0 = Date.now();
      el("mic").classList.add("rec");
      ticker = setInterval(function(){
        var s2 = Math.floor((Date.now()-t0)/1000);
        el("st").textContent = T("s_kuuntelen")+" · "+s2+" s · "+T("s_valmis");
        if (s2 >= 40) stopRec();
      }, 250);
    }).catch(function(){ el("st").textContent = T("s_salli"); });
  }

  function stopRec(){
    if (rec && rec.state === "recording") rec.stop();
    // Дорожки НЕ глушим: закрытый поток означает новый запрос разрешения
    // на следующем вопросе.
    clearInterval(ticker);
    el("mic").classList.remove("rec");
  }

  function finishRec(){
    if (!chunks.length || (Date.now()-t0) < 800){
      el("st").textContent = T("s_lyhyt");
      return;
    }
    el("st").textContent = T("s_kasittelen");
    var type = (rec && rec.mimeType) ? rec.mimeType.split(";")[0] : "audio/webm";
    new Blob(chunks, {type:type}).arrayBuffer().then(function(b){
      return new Promise(function(resolve, reject){
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { reject(0); return; }
        var ctx = new AC();
        if (ctx.state === "suspended" && ctx.resume) { try { ctx.resume(); } catch(e){} }
        var p;
        try { p = ctx.decodeAudioData(b, resolve, reject); } catch(e) { reject(e); return; }
        if (p && typeof p.then === "function") p.then(resolve, reject);
      }).then(function(a){
        return { mimeType:"audio/wav", data:b64(wav(a,16000)) };
      }, function(){
        return { mimeType:type, data:b64(b) };
      });
    }).then(function(part){
      el("st").textContent = "";
      // Текст распознанного придёт от воркера в ответе; пока показываем,
      // что запись ушла — иначе человеку кажется, что ничего не случилось.
      laheta([{inlineData:part}], "\u2026");
    }).catch(function(){
      el("st").textContent = T("s_virhe");
    });
  }

  function b64(ab){
    var b = new Uint8Array(ab), s = "", st = 0x8000;
    for (var i=0;i<b.length;i+=st) s += String.fromCharCode.apply(null, b.subarray(i, i+st));
    return btoa(s);
  }
  function wav(buf, rate){
    var src = buf.getChannelData(0), ratio = buf.sampleRate/rate;
    var n = Math.floor(src.length/ratio), pcm = new Int16Array(n);
    for (var i=0;i<n;i++){ var v = src[Math.floor(i*ratio)]; v = v<-1?-1:v>1?1:v; pcm[i] = v<0 ? v*0x8000 : v*0x7FFF; }
    var out = new ArrayBuffer(44+pcm.length*2), dv = new DataView(out);
    function str(o,s){ for (var j=0;j<s.length;j++) dv.setUint8(o+j, s.charCodeAt(j)); }
    str(0,"RIFF"); dv.setUint32(4, 36+pcm.length*2, true); str(8,"WAVEfmt ");
    dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
    dv.setUint32(24,rate,true); dv.setUint32(28,rate*2,true);
    dv.setUint16(32,2,true); dv.setUint16(34,16,true);
    str(36,"data"); dv.setUint32(40, pcm.length*2, true);
    for (var m=0;m<pcm.length;m++) dv.setInt16(44+m*2, pcm[m], true);
    return out;
  }

  /* ---------- галерея ----------
     Перенесено с visuals.ai-craft-studio.com без изменений в логике.
     Что здесь важно и чего я сам не сделал бы:
       setActive  — центральная карточка получает класс active: размер,
                    яркость и подпись. Соседние притушены.
       стрелки    — направление как у них: левая листает ВПЕРЁД.
       колесо     — замок на 420 мс, иначе одно движение пролистывает всё.
       перетаскивание — только мышью. У касания e.pointerType === "touch"
                    и мы не вмешиваемся: там работает родная прокрутка. */
  (function(){
    var rail = el("rail");
    if (!rail) return;
    var prev = el("prev"), next = el("next"), laskuri = el("laskuri");
    // Карточки появляются после поиска, поэтому список берём заново
    // при каждом обращении, а не один раз при загрузке.
    var items = [], total = 0;
    function lue(){
      items = rail.querySelectorAll(".item");
      total = items.length;
    }
    lue();

    function current(){
      var mid = rail.scrollLeft + rail.clientWidth / 2;
      var best = 0, bestD = Infinity;
      for (var i = 0; i < total; i++){
        var c = items[i].offsetLeft + items[i].offsetWidth / 2;
        var d = Math.abs(c - mid);
        if (d < bestD){ bestD = d; best = i; }
      }
      return best;
    }

    function goTo(i){
      if (i < 0) i = 0;
      if (i > total - 1) i = total - 1;
      var it = items[i];
      rail.scrollTo({ left: it.offsetLeft - (rail.clientWidth - it.offsetWidth) / 2,
                      behavior: "smooth" });
    }

    var activeIdx = -1;
    function setActive(i){
      if (i === activeIdx) return;
      activeIdx = i;
      for (var k = 0; k < total; k++){
        if (k === i) items[k].classList.add("active");
        else         items[k].classList.remove("active");
      }
    }

    function refresh(){
      if (!total) {
        // Результата ещё нет — подпись остаётся, цифр в ней нет.
        if (laskuri) laskuri.innerHTML = '<span class="merkki">' + T("hakutulos") + '</span>';
        return;
      }
      var i = current();
      setActive(i);
      // Подпись говорит, что это результат поиска, а не картинки
      // для красоты. Пока объекты заглушечные, слово то же.
      if (laskuri) laskuri.innerHTML = '<span class="merkki">' + T("hakutulos") + '<b>' +
        (i + 1) + "/" + total + "</b></span>";
      if (prev) prev.disabled = rail.scrollLeft > rail.scrollWidth - rail.clientWidth - 4;
      if (next) next.disabled = rail.scrollLeft < 4;
    }

    rail.addEventListener("scroll", refresh, {passive:true});
    window.addEventListener("resize", refresh);
    refresh();

    // Вызывается после отрисовки результата поиска.
    window.paivitaRail = function(){ lue(); activeIdx = -1; refresh(); };

    /* стрелка = направление движения ленты */
    if (prev) prev.addEventListener("click", function(){ goTo(current() + 1); });
    if (next) next.addEventListener("click", function(){ goTo(current() - 1); });

    var wheelLock = false;
    rail.addEventListener("wheel", function(e){
      var dy = Math.abs(e.deltaY), dx = Math.abs(e.deltaX);
      if (dx > dy) return;
      if (dy < 2) return;
      e.preventDefault();
      if (wheelLock) return;
      wheelLock = true;
      goTo(current() + (e.deltaY > 0 ? 1 : -1));
      setTimeout(function(){ wheelLock = false; }, 420);
    }, {passive:false});

    var down = false, startX = 0, startLeft = 0, moved = 0;
    // Перетащили — значит листали, а не выбирали. Выбор об этом спрашивает.
    window.railVeti = function(){ return moved > 8; };
    rail.addEventListener("pointerdown", function(e){
      if (e.pointerType === "touch") { moved = 0; return; }
      down = true; moved = 0;
      startX = e.clientX;
      startLeft = rail.scrollLeft;
      rail.classList.add("dragging");
      rail.setPointerCapture(e.pointerId);
    });
    rail.addEventListener("pointermove", function(e){
      if (!down) return;
      var d = e.clientX - startX;
      moved = Math.abs(d);
      rail.scrollLeft = startLeft - d;
    });
    function endDrag(e){
      if (!down) return;
      down = false;
      rail.classList.remove("dragging");
      if (e && e.pointerId != null && rail.hasPointerCapture && rail.hasPointerCapture(e.pointerId)) {
        rail.releasePointerCapture(e.pointerId);
      }
      if (moved > 8) goTo(current());
    }
    rail.addEventListener("pointerup", endDrag);
    rail.addEventListener("pointercancel", endDrag);

    rail.setAttribute("tabindex", "0");
    rail.addEventListener("keydown", function(e){
      if (e.key === "ArrowLeft"){  e.preventDefault(); goTo(current() + 1); }
      if (e.key === "ArrowRight"){ e.preventDefault(); goTo(current() - 1); }
    });
  })();

  if (el("kieli")) el("kieli").addEventListener("change", function(){
    kieli = this.value;
    document.documentElement.setAttribute("lang", kieli);
    kaanna();
  });

  /* Карта встаёт посередине между подписью и вопросом — зазоры сверху
     и снизу одинаковые на любом экране. */
  function asetaKartta(){
    var k = document.querySelector(".kartta");
    var yla = el("laskuri");
    var ala = el("kysymys");
    if (!k || !yla || !ala) return;
    var a = yla.getBoundingClientRect().bottom;
    var b = ala.getBoundingClientRect().top;
    var h = k.getBoundingClientRect().height;
    var tila_ = b - a;
    k.style.top = Math.round(a + (tila_ - h) / 2) + "px";
  }
  window.addEventListener("resize", asetaKartta);
  var _vanhaVaihe = vaihe;
  vaihe = function(n){ _vanhaVaihe(n); requestAnimationFrame(asetaKartta); };

  kaanna();
  piirraChips(); vaihe(1); aloita();
  requestAnimationFrame(asetaKartta);
})();
</script>
